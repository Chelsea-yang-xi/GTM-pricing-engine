spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gtm_pricing}
spring.datasource.username=${DB_USERNAME:gtm}
spring.datasource.password=${DB_PASSWORD:gtm}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#spring profiles -separated lightweight local configuration from PostgreSQL configuration using Spring Profiles, so infrastructure-specific settings did not leak into the application logic.
